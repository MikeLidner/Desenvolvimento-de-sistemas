<!DOCTYPE html>
<html>
<head>
    <title>Agendamentos</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js"></script>
</head>
<body>

<h2>Agendamentos</h2>

<div class="card">
    <select id="cliente"></select>
    <select id="servico"></select>
    <select id="profissional"></select>

    <input type="datetime-local" id="data">
    <input type="number" id="duracao" placeholder="Duração (min)">
    
    <button onclick="salvar()">Agendar</button>
</div>

<h3>Lista de Agendamentos</h3>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Cliente</th>
            <th>Serviço</th>
            <th>Profissional</th>
            <th>Data</th>
            <th>Duração</th>
            <th>Status</th>
            <th>Ação</th>
        </tr>
    </thead>
    <tbody id="lista"></tbody>
</table>

<button onclick="window.location='index.html'">Voltar</button>

<script>
async function carregarListagens() {
    const clientes = await apiGet("/clientes");
    const servicos = await apiGet("/servicos");
    const profissionais = await apiGet("/profissionais");

    cliente.innerHTML = clientes.map(c => `<option value="${c.id}">${c.nome}</option>`).join("");
    servico.innerHTML = servicos.map(s => `<option value="${s.id}">${s.nome}</option>`).join("");
    profissional.innerHTML = profissionais.map(p => `<option value="${p.id}">${p.nome}</option>`).join("");
}

async function carregarAgendamentos() {
    const listaAg = await apiGet("/agendamentos");

    lista.innerHTML = listaAg.map(a =>
        `<tr>
            <td>${a.id}</td>
            <td>${a.cliente}</td>
            <td>${a.servico}</td>
            <td>${a.profissional}</td>
            <td>${new Date(a.data).toLocaleString()}</td>
            <td>${a.duracao} min</td>
            <td>${a.status}</td>
            <td>
                <select onchange="atualizarStatus(${a.id}, this.value)">
                    <option ${a.status==='agendado'?'selected':''}>agendado</option>
                    <option ${a.status==='concluído'?'selected':''}>concluído</option>
                    <option ${a.status==='cancelado'?'selected':''}>cancelado</option>
                </select>
            </td>
        </tr>`
    ).join("");
}

async function atualizarStatus(id, status) {
    await apiPatch("/agendamentos/" + id + "/status", { status });
    carregarAgendamentos();
}

async function salvar() {
    const obj = {
        clienteId: Number(cliente.value),
        servicoId: Number(servico.value),
        profissionalId: Number(profissional.value),
        data: data.value,
        duracao: Number(duracao.value)
    };

    if (!obj.data || obj.duracao <= 0) {
        alert("Preencha a data e duração corretamente!");
        return;
    }

    const resp = await apiPost("/agendamentos", obj);

    if (resp.erro) {
        alert(resp.erro);
        return;
    }

    carregarAgendamentos();
}

carregarListagens();
carregarAgendamentos();
</script>

</body>
</html>
