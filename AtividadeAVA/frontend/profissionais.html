<!DOCTYPE html>
<html>
<head>
    <title>Profissionais</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js"></script>
</head>
<body>

<h2>Cadastro de Profissionais</h2>

<input id="busca" placeholder="Buscar..." onkeyup="carregar()">

<div class="card">
    <input id="nome" placeholder="Nome do profissional">
    <input id="especialidade" placeholder="Especialidade">
    <button onclick="salvar()">Salvar</button>
</div>

<h3>Profissionais cadastrados</h3>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Profissional</th>
            <th>Especialidade</th>
            <th>Ações</th>
        </tr>
    </thead>
    <tbody id="lista"></tbody>
</table>

<button onclick="window.location='index.html'">Voltar</button>

<script>
let editando = null;

async function carregar() {
    const termo = busca.value;
    const profissionais = await apiGet("/profissionais?busca=" + termo);

    lista.innerHTML = profissionais.map(p =>
        `<tr>
            <td>${p.id}</td>
            <td>${p.nome}</td>
            <td>${p.especialidade}</td>
            <td>
                <button onclick="editar(${p.id}, '${p.nome}', '${p.especialidade}')">Editar</button>
                <button onclick="excluir(${p.id})">Excluir</button>
            </td>
        </tr>`
    ).join("");
}

function editar(id, nome, especialidade) {
    editando = id;
    document.getElementById("nome").value = nome;
    document.getElementById("especialidade").value = especialidade;
}

async function excluir(id) {
    await apiDelete("/profissionais/" + id);
    carregar();
}

async function salvar() {
    const obj = {
        nome: nome.value,
        especialidade: especialidade.value
    };

    if (!obj.nome) {
        alert("Nome é obrigatório!");
        return;
    }

    if (editando)
        await apiPut("/profissionais/" + editando, obj);
    else
        await apiPost("/profissionais", obj);

    editando = null;
    nome.value = especialidade.value = "";
    carregar();
}

carregar();
</script>

</body>
</html>
