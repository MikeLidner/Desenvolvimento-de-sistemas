<!DOCTYPE html>
<html>
<head>
    <title>Serviços</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js"></script>
</head>
<body>

<h2>Cadastro de Serviços</h2>

<input id="busca" placeholder="Buscar..." onkeyup="carregar()">

<div class="card">
    <input id="nome" placeholder="Nome do serviço">
    <input id="duracao" placeholder="Duração (min)" type="number">
    <input id="valor" placeholder="Valor (R$)" type="number" step="0.01">
    <button onclick="salvar()">Salvar</button>
</div>

<h3>Serviços cadastrados</h3>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Serviço</th>
            <th>Duração</th>
            <th>Valor</th>
            <th>Ações</th>
        </tr>
    </thead>
    <tbody id="lista"></tbody>
</table>

<button onclick="window.location='index.html'">Voltar</button>

<script>
let editando = null;

async function carregar() {
    const termo = busca.value;
    const servicos = await apiGet("/servicos?busca=" + termo);

    lista.innerHTML = servicos.map(s =>
        `<tr>
            <td>${s.id}</td>
            <td>${s.nome}</td>
            <td>${s.duracao} min</td>
            <td>R$ ${s.valor.toFixed(2)}</td>
            <td>
                <button onclick="editar(${s.id}, '${s.nome}', ${s.duracao}, ${s.valor})">Editar</button>
                <button onclick="excluir(${s.id})">Excluir</button>
            </td>
        </tr>`
    ).join("");
}

function editar(id, nome, duracao, valor) {
    editando = id;
    document.getElementById("nome").value = nome;
    document.getElementById("duracao").value = duracao;
    document.getElementById("valor").value = valor;
}

async function excluir(id) {
    await apiDelete("/servicos/" + id);
    carregar();
}

async function salvar() {
    const obj = {
        nome: nome.value,
        duracao: Number(duracao.value),
        valor: Number(valor.value)
    };

    if (!obj.nome || obj.duracao <= 0 || obj.valor <= 0) {
        alert("Preencha todos os campos corretamente!");
        return;
    }

    if (editando)
        await apiPut("/servicos/" + editando, obj);
    else
        await apiPost("/servicos", obj);

    editando = null;
    nome.value = duracao.value = valor.value = "";
    carregar();
}

carregar();
</script>

</body>
</html>
