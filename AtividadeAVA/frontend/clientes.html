<!DOCTYPE html>
<html>
<head>
    <title>Clientes</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js"></script>
</head>
<body>

<h2>Cadastro de Clientes</h2>

<input id="busca" placeholder="Buscar..." onkeyup="carregar()">

<div class="card">
    <input id="nome" placeholder="Nome">
    <input id="telefone" placeholder="Telefone">
    <input id="endereco" placeholder="Endereço">
    <button onclick="salvar()">Salvar</button>
</div>

<h3>Clientes cadastrados</h3>

<table>
    <thead>
        <tr><th>ID</th><th>Nome</th><th>Ações</th></tr>
    </thead>
    <tbody id="lista"></tbody>
</table>

<button onclick="window.location='index.html'">Voltar</button>

<script>
let editando = null;

async function carregar() {
    const termo = busca.value;
    const clientes = await apiGet("/clientes?busca=" + termo);

    lista.innerHTML = clientes.map(c =>
        `<tr>
            <td>${c.id}</td>
            <td>${c.nome}</td>
            <td>
                <button onclick="editar(${c.id}, '${c.nome}', '${c.telefone}', '${c.endereco}')">Editar</button>
                <button onclick="excluir(${c.id})">Excluir</button>
            </td>
        </tr>`
    ).join("");
}

function editar(id, nome, telefone, endereco) {
    editando = id;
    document.getElementById("nome").value = nome;
    document.getElementById("telefone").value = telefone;
    document.getElementById("endereco").value = endereco;
}

async function excluir(id) {
    await apiDelete("/clientes/" + id);
    carregar();
}

async function salvar() {
    const obj = {
        nome: nome.value,
        telefone: telefone.value,
        endereco: endereco.value
    };

    if (!obj.nome) {
        alert("Nome é obrigatório");
        return;
    }

    if (editando)
        await apiPut("/clientes/" + editando, obj);
    else
        await apiPost("/clientes", obj);

    editando = null;
    nome.value = telefone.value = endereco.value = "";
    carregar();
}

carregar();
</script>

</body>
</html>
